name: Build and publish release images

on:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: prairieresearchinstitute/isgs_waterdb

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The seeder image ships the schema push + seed script only; the
          # NDJSON in data/ is gitignored, so it must be mounted at /data
          # when the container runs.
          - variant: runtime
            suffix: ''
            platform: linux/amd64
            runner: ubuntu-latest
          - variant: runtime
            suffix: ''
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - variant: seeder
            suffix: -seed
            platform: linux/amd64
            runner: ubuntu-latest
          - variant: seeder
            suffix: -seed
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Prepare platform slug
        run: echo "PLATFORM_SLUG=${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.variant }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.suffix }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.variant }}-${{ env.PLATFORM_SLUG }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}-${{ env.PLATFORM_SLUG }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest='${{ steps.build.outputs.digest }}'
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.variant }}-${{ env.PLATFORM_SLUG }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: runtime
            suffix: ''
          - variant: seeder
            suffix: -seed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.variant }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            --tag "$REGISTRY/$IMAGE_NAME$IMAGE_SUFFIX:$RELEASE_TAG" \
            $(printf "$REGISTRY/$IMAGE_NAME$IMAGE_SUFFIX@sha256:%s " *)
        env:
          IMAGE_SUFFIX: ${{ matrix.suffix }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}

      - name: Inspect manifest
        run: docker buildx imagetools inspect "$REGISTRY/$IMAGE_NAME$IMAGE_SUFFIX:$RELEASE_TAG"
        env:
          IMAGE_SUFFIX: ${{ matrix.suffix }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
