[project]
name = "isgs_dagster"
requires-python = ">=3.10,<3.15"
version = "0.1.0"
dependencies = [
    "dagster==1.13.6",
    "psycopg2-binary>=2.9",
    "boto3>=1.26",
    "pandas>=2.3.3",
    "openpyxl>=3.1.5",
]

[dependency-groups]
dev = [
    "dagster-dg-cli",
    "dagster-webserver",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "isgs_dagster"
registry_modules = [
    "isgs_dagster.components.*",
]


