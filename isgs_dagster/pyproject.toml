[project]
name = "isgs_dagster"
requires-python = ">=3.10,<3.15"
version = "0.1.0"
dependencies = [
    "dagster==1.13.6",
    "psycopg2-binary>=2.9",
    "boto3>=1.26",
    "pandas>=2.3.3",
    "openpyxl>=3.1.5",
]

[dependency-groups]
# Everything the deployed image needs on top of [project.dependencies]: the UI,
# Postgres-backed instance storage, and the Docker run launcher. Each of these
# hard-pins dagster==1.13.6 itself, so leaving them unpinned keeps the version
# bump in one place. Built into the image with:
#   uv sync --locked --no-default-groups --group deploy
deploy = [
    "dagster-webserver",
    "dagster-postgres",
    "dagster-docker",
]
dev = [
    { include-group = "deploy" },
    "dagster-dg-cli",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "isgs_dagster"
